<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
</head>
<body>
    <h1>Contact and Registration Page</h1>

     <a href ="index.html">Home</a>
   <a href ="timetable.html">Timetable</a>
   <a href ="contact.html">Contact</a>
   <hr>
<h2>Part A: Contact Form</h2>
     <form>
    <table border="1" cellpadding="8">
        <tr>
            <td>Name</td>
        <td><input type="text" name="name"></td>
        </tr>

        <tr>
            <td>Email</td>
            <td><input type="email" name ="email"></td>
        </tr>
        <tr>
            <td>Messege</td>
            <td><textarea name="message" rows="4" cols="30"></textarea></td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <input type="submit" value="Submit">
            </td>

        </tr>



    </table>
   </form>
   <hr>
   <h2>Part B: Student Registration Form</h2>
   <form>
    <table border="1" cellpadding="8">
        <tr>
            <td>Full Name</td>
            <td><input type="text" name="fullname" required></td>
        </tr>
        <tr>
            <td>Email</td>
            <td><input type="email" name="reg_email" required></td>
        </tr>
        <tr>
            <td>Password:</td>
            <td><input type="password" name="password" required</td>
        </tr>
        <tr>
            <td>Gender::</td>
            <td><input type="radio" name="gender" value="male" required>Male
                <input type="radio" name="gender" value="female">Female</td>
        </tr>
        <tr>
            <td>Courses:</td>
            <td><input type="checkbox" name="course" value="html">HTML
                <input type="checkbox" name="course" value="css">CSS
            <input type="checkbox" name="course" value="JavaScript">javaScript</td>

        </tr>
        <tr>
            <td colspan="2" align="center">
                <input type="submit" value="Register">
            </td>
        </tr>
    </table>
   </form>



</body>
</html>
